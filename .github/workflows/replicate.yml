name: Push to Replicate

on:
  push:
    paths:
      - 'watermark-worker/**'
      - '.github/workflows/replicate.yml'
    branches:
      - main
  workflow_dispatch:

jobs:
  push_to_replicate:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          docker-images: false

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Cog
        uses: replicate/setup-cog@v2
        with:
          token: ${{ secrets.REPLICATE_API_TOKEN }}

      - name: Push to Replicate (with retry on r8.im timeout)
        working-directory: watermark-worker
        run: |
          for attempt in 1 2 3 4 5; do
            echo "=== [Intento $attempt/5] Subiendo imagen a r8.im/pagaforr-droid/tandu-watermark2 ==="
            if cog push r8.im/pagaforr-droid/tandu-watermark2; then
              echo "=== Push completado con éxito en el intento $attempt ==="
              exit 0
            fi
            echo "Fallo temporal en r8.im (timeout). Reintentando en $((attempt * 10)) segundos..."
            sleep $((attempt * 10))
          done
          echo "Error: No se pudo subir la imagen tras 5 intentos."
          exit 1
