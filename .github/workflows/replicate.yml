name: Push to Replicate

on:
  push:
    paths:
      - 'watermark-worker/**'
      - '.github/workflows/replicate.yml'
    branches:
      - main
  workflow_dispatch:

jobs:
  push_to_replicate:
    runs-on: ubuntu-latest
    steps:
      # CUDA + torch images exceed the default free disk of GitHub runners
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          docker-images: false

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Cog
        uses: replicate/setup-cog@v2
        with:
          token: ${{ secrets.REPLICATE_API_TOKEN }}

      - name: Push to Replicate
        working-directory: watermark-worker
        run: cog push r8.im/pagaforr-droid/tandu-watermark2
