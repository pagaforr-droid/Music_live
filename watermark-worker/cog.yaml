build:
  gpu: true
  system_packages:
    - "ffmpeg"
    - "libsndfile1"
  python_version: "3.10"
  python_packages:
    - "torch==2.1.2"
    - "torchaudio==2.1.2"
    - "demucs==4.0.0"
    - "librosa==0.10.1"
    - "soundfile==0.12.1"
    - "requests==2.31.0"
    - "numpy==1.26.4"
  run:
    # Pre-cache HTDemucs weights inside the image to avoid downloading them on every cold boot
    - "python -c \"from demucs.pretrained import get_model; get_model('htdemucs')\""

predict: "predict.py:Predictor"